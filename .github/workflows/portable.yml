name: Build portable candidate archives
on: workflow_dispatch
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,portable]" -Ccmake.define.MAJIQWALK_OPENMP=OFF
      - run: python -m pytest -q
      - run: python scripts/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-candidate-${{ matrix.os }}
          path: dist/*-portable.zip
