schema_version: 1
simulation:
  steps: 100
  save_every: 1
model:
  type: classical_random_walk
geometry:
  type: line
  shape: [201]
  boundary: open
classical:
  type: persistent
  persistence: 0.9
  initial_direction_probabilities: [0.5, 0.5]
initial_state:
  position:
    site: 100
observables:
  - type: probability
  - type: moments
output:
  file: line_classical_persistent.h5
plot:
  preset: aps_pr
  formats: [pdf, png]
